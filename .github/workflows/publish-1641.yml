name: Publish encrypted ARGUS 16.4.1 dashboard

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1641.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified private artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            'https://sdmntprwestus3.oaiusercontent.com/files/00000000-08b8-81fd-9c39-d98ae155d07d/raw?se=2026-07-31T12:48:50Z&sp=r&sv=2026-02-06&sr=b&scid=091935bb-647d-59ee-848e-e3d4731ecea8&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T02:12:18Z&ske=2026-08-02T02:12:18Z&sks=b&skv=2026-02-06&sig=TzrS8hicCygLyuPDgTHcvBBaboqlhwiTKM9eYygRFWw%3D' \
            -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          echo 'd9276913b101cdd0a36986c3a0907749f21eb955bf2c2ee6fa7ef9549fbd2f31  '"$APK" | sha256sum -c -
          cp "$APK" ARGUS-16.4.1.apk

      - name: Encrypt for registered tablet and create manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography
          python <<'PY'
          import base64, hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2'
          version_code = 1640100
          version_name = '16.4.1-master-unified-dashboard-shell'
          package_name = 'com.argus.standalone.main'
          cert = 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          public_pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA01MP53jzEzujpxxw5oXU
          ENsszGeq69DLwQLZQ6SWZ/ighUKcRvfSaPMj8ZT/o2CX5VeL6bc595xRFH85szC9
          XoOgD4C+R55iRKOvV9vAJAlsFWCsgWFYfiCEJE4lR8CmoUuUEcBYRwQ4pC4+j/nK
          OGLDRU8aG8NBoY+QCvprc7w+k09C+O9D48msfHWUEZCDPGlyeRDjYaVfKeNswLcm
          xj/Pqs808ChtDkp03fARCGE2UHw273a/3wjX8KjQeAIoMLSiqWY8z99Cx1SI4psi
          WescaJCFZp4Qf767v/79/FVItDXMyOD+ELHksWBA0734rhMVdycvRaGMsou8On4W
          2JtFP9Sd2bk8GY7a3JxfLx8P2BpZGXJs2rwc0HU+lXKidTcGeH7uJX2uAGunom5N
          M6DeMyLWnmRjKy9/hNDfEvtPBencvJ5d7NMgcMre3ZFCStx68JeqLrmE2wAWTu8n
          Z4xDa9dL/foQ3WfGeKbn21G9nllmW3kzPzlyHoGUF2bbAgMBAAE=
          -----END PUBLIC KEY-----
          '''.replace(b'          ', b'')

          plaintext = Path('ARGUS-16.4.1.apk').read_bytes()
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          if plaintext_sha != 'd9276913b101cdd0a36986c3a0907749f21eb955bf2c2ee6fa7ef9549fbd2f31':
              raise SystemExit('plaintext sha mismatch')

          aes_key = os.urandom(32)
          nonce = os.urandom(12)
          aad = f'ARGUS|stable-device-bound|{package_name}|{version_code}|{device_id}'.encode()
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          public_key = serialization.load_pem_public_key(public_pem)
          wrapped = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA1()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )

          payload_name = 'ARGUS-MASTER-16.4.1-bcc61ed52b22f6c8.apk.enc'
          payload_dir = Path('payloads')
          payload_dir.mkdir(exist_ok=True)
          for old in payload_dir.glob('*.enc'):
              old.unlink()
          (payload_dir / payload_name).write_bytes(ciphertext)

          manifest = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': package_name,
              'version_code': version_code,
              'version_name': version_name,
              'payload_url': f'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}',
              'ciphertext_sha256': hashlib.sha256(ciphertext).hexdigest(),
              'plaintext_sha256': plaintext_sha,
              'wrapped_key_base64': base64.b64encode(wrapped).decode(),
              'nonce_base64': base64.b64encode(nonce).decode(),
              'aad_base64': base64.b64encode(aad).decode(),
              'certificate_sha256': cert,
              'device_id': device_id,
              'published_at': datetime.now(timezone.utc).isoformat(),
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'release_notes': [
                  'Утверждённый единый главный экран ARGUS',
                  'Левое меню: рынок, этажи 1–5, боевой контур, сделка и система',
                  'MASTER Control Center с режимами MANUAL и ADAPTIVE',
                  'Порог Telegram 80–100 с базовым значением 87',
                  'Реальные статусы Android-ядра и Market Data Plane',
                  'Фиктивные торговые сигналы не создаются',
                  'Автоматические ордера остаются HARD BLOCKED',
              ],
          }
          Path('latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifact.zip ARGUS-16.4.1.apk
          rm -rf artifact
          git rm .github/workflows/publish-1641.yml
          git config user.name 'ARGUS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A latest.json payloads
          git commit -m 'Publish encrypted ARGUS 16.4.1 unified dashboard'
          git push
