name: Publish encrypted ARGUS 16.8.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout channel main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified private artifact
        env:
          ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-7c8c-8246-9f71-b9adfebde95d/raw?se=2026-07-31T18:16:23Z&sp=r&sv=2026-02-06&sr=b&scid=ce604204-1754-5a0e-a51a-b474cc05e592&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T06:14:40Z&ske=2026-08-02T06:14:40Z&sks=b&skv=2026-02-06&sig=Kva5q36%2B86AhuNYzGA%2BLaDB581HNP%2BIbhz6D%2BB1a%2B1Q%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/ARGUS-MASTER-16.8.0-Three-Regime-Calibration-Traders.apk
          echo "584d3d2945237a86428a534c30e941a09736ce6d374db6936734c13c077589a4  artifact/ARGUS-MASTER-16.8.0-Three-Regime-Calibration-Traders.apk" | sha256sum -c -

      - name: Encrypt for registered tablet and write manifest
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          version_code = 1680000
          version_name = "16.8.0-master-three-regime-calibration-traders"
          package_name = "com.argus.standalone.main"
          certificate_sha256 = "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0"
          public_key_der_b64 = ""

          apk_path = Path("artifact/ARGUS-MASTER-16.8.0-Three-Regime-Calibration-Traders.apk")
          plaintext = apk_path.read_bytes()
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          expected_sha = "584d3d2945237a86428a534c30e941a09736ce6d374db6936734c13c077589a4"
          if plaintext_sha != expected_sha:
              raise SystemExit("plaintext hash mismatch")

          aad = f"ARGUS|stable-device-bound|{package_name}|{version_code}|{device_id}".encode()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          public_key = serialization.load_der_public_key(base64.b64decode(public_key_der_b64))
          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA1()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )

          payload_dir = Path("payloads")
          payload_dir.mkdir(exist_ok=True)
          for old in payload_dir.glob("*.enc"):
              old.unlink()
          payload_name = "ARGUS-MASTER-16.8.0-bcc61ed52b22f6c8.apk.enc"
          payload_path = payload_dir / payload_name
          payload_path.write_bytes(ciphertext)

          manifest = {
              "schema": 1,
              "channel": "stable-device-bound",
              "status": "ready",
              "package_name": package_name,
              "version_code": version_code,
              "version_name": version_name,
              "payload_url": f"https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}",
              "ciphertext_sha256": hashlib.sha256(ciphertext).hexdigest(),
              "plaintext_sha256": plaintext_sha,
              "wrapped_key_base64": base64.b64encode(wrapped_key).decode(),
              "nonce_base64": base64.b64encode(nonce).decode(),
              "aad_base64": base64.b64encode(aad).decode(),
              "certificate_sha256": certificate_sha256,
              "device_id": device_id,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "key_wrap_profile": "RSA-OAEP-SHA256-MGF1-SHA1",
              "release_notes": [
                  "1-й этаж получил отдельную калибровку UP, DOWN и SIDEWAYS",
                  "Для 7 монет и 5 горизонтов рассчитываются 35 трёхрежимных моделей",
                  "Сохраняются фактические режимы и переходы между ними",
                  "2-й этаж получил Волновика, Переключателя и Диапазонника",
                  "Каждый торгаш работает только в последовательном replay без перекрывающихся позиций",
                  "Перед сменой направления виртуальная позиция обязательно закрывается",
                  "Replay учитывает консервативные затраты полного цикла 12 bps",
                  "Все результаты имеют боевой вес 0 и помечены НЕ СИГНАЛ",
                  "Telegram, Entry, SL, TP и торговое разрешение отключены",
                  "Автоматические и реальные ордера остаются HARD BLOCKED"
              ],
          }
          Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish encrypted payload only
        run: |
          set -euo pipefail
          rm -rf artifact artifact.zip
          git rm .github/workflows/publish-1680.yml
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish encrypted ARGUS 16.8.0 three-regime stage"
          git push origin HEAD:main
