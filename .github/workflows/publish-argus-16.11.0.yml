name: Publish ARGUS 16.11.0 device-bound update

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reassemble and verify encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.11.0-bcc61ed52b22f6c8-v16011000.apk.enc"
          WORK="$RUNNER_TEMP/argus-1611"
          mkdir -p "$WORK"
          cat staging-1611/payload-* | base64 -d > "$WORK/$NEW"
          echo "e19fc531cc0412f7eac0a519e82541c9ac8fcb7f9d005c72fa3d7f1d7a04894b  $WORK/$NEW" | sha256sum -c -
          cp staging-1611/latest-1611.json "$WORK/latest.json"
          python3 - "$WORK" <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path
          work=Path(sys.argv[1]); manifest=json.loads((work/'latest.json').read_text())
          payload=work/'ARGUS-MASTER-16.11.0-bcc61ed52b22f6c8-v16011000.apk.enc'
          assert manifest['schema']==1 and manifest['channel']=='stable-device-bound'
          assert manifest['status']=='ready'
          assert manifest['package_name']=='com.argus.standalone.main'
          assert manifest['version_code']==16011000 and manifest['version_code']>16010000
          assert manifest['version_name']=='16.11.0-third-fourth-floor-shadow'
          assert manifest['device_id']=='bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2'
          assert manifest['certificate_sha256']=='d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          assert manifest['plaintext_sha256']=='8c3e2ceb158cfff86064b63ee8a662d6fe759d33861214406161176c996e986a'
          assert hashlib.sha256(payload.read_bytes()).hexdigest()==manifest['ciphertext_sha256']
          assert len(base64.b64decode(manifest['wrapped_key_base64']))==384
          assert len(base64.b64decode(manifest['nonce_base64']))==12
          assert manifest['key_wrap_profile']=='RSA-OAEP-SHA256-MGF1-SHA1'
          print('ARGUS_16_11_0_DEVICE_BOUND_PUBLICATION PASS')
          PY
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo "Open APK must never enter the update channel" >&2
            exit 1
          fi
      - name: Atomically publish from current main
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.11.0-bcc61ed52b22f6c8-v16011000.apk.enc"
          WORK="$RUNNER_TEMP/argus-1611"
          git fetch origin main
          git checkout -B publish-main origin/main
          CURRENT="$(python3 -c 'import json;print(json.load(open("latest.json"))["version_code"])')"
          test 16011000 -gt "$CURRENT"
          mkdir -p payloads
          find payloads -maxdepth 1 -type f -name '*.enc' ! -name "$NEW" -delete
          cp "$WORK/$NEW" "payloads/$NEW"
          cp "$WORK/latest.json" latest.json
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish encrypted ARGUS 16.11.0 third fourth floor shadow"
          git push origin HEAD:main
