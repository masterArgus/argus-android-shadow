name: Publish ARGUS 16.3.0 Local Runtime Foundation

on:
  push:
    paths:
      - .github/workflows/publish-16300-local-runtime.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==45.0.5

      - name: Download verified private APK artifact
        env:
          ARGUS_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-e89c-81f4-aee8-7e5bbd5c7147/raw?se=2026-07-31T08:20:52Z&sp=r&sv=2026-02-06&sr=b&scid=cf2b7ef6-e624-5320-b437-48cc9e1335e6&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T05:05:23Z&ske=2026-08-02T05:05:23Z&sks=b&skv=2026-02-06&sig=bMNILM56tkpQvnjZTG5hkMR56YV5DZuBXh8VxjJXYIA%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARGUS_ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name 'ARGUS-MASTER-16.3.0-Local-Runtime-Foundation.apk' | head -n1)"
          test -f "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "6b907ab6fbfeaae3163c43a41c14a72de48b464f73ec2d76436136a42134be66  $APK" | sha256sum -c -

      - name: Encrypt only for registered ARGUS tablet
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          public_key_pem = b'''-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA01MP53jzEzujpxxw5oXU
ENsszGeq69DLwQLZQ6SWZ/ighUKcRvfSaPMj8ZT/o2CX5VeL6bc595xRFH85szC9
XoOgD4C+R55iRKOvV9vAJAlsFWCsgWFYfiCEJE4lR8CmoUuUEcBYRwQ4pC4+j/nK
OGLDRU8aG8NBoY+QCvprc7w+k09C+O9D48msfHWUEZCDPGlyeRDjYaVfKeNswLcm
xj/Pqs808ChtDkp03fARCGE2UHw273a/3wjX8KjQeAIoMLSiqWY8z99Cx1SI4psi
WescaJCFZp4Qf767v/79/FVItDXMyOD+ELHksWBA0734rhMVdycvRaGMsou8On4W
2JtFP9Sd2bk8GY7a3JxfLx8P2BpZGXJs2rwc0HU+lXKidTcGeH7uJX2uAGunom5N
M6DeMyLWnmRjKy9/hNDfEvtPBencvJ5d7NMgcMre3ZFCStx68JeqLrmE2wAWTu8n
Z4xDa9dL/foQ3WfGeKbn21G9nllmW3kzPzlyHoGUF2bbAgMBAAE=
-----END PUBLIC KEY-----
'''
          public_key = serialization.load_pem_public_key(public_key_pem)
          der = public_key.public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          assert hashlib.sha256(der).hexdigest() == device_id

          apk = Path(os.environ["APK"])
          plaintext = apk.read_bytes()
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          assert plaintext_sha == "6b907ab6fbfeaae3163c43a41c14a72de48b464f73ec2d76436136a42134be66"

          aes_key = os.urandom(32)
          nonce = os.urandom(12)
          aad = b"ARGUS|stable-device-bound|com.argus.standalone.main|1630000|" + device_id.encode()
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(hashes.SHA1()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )

          payload_dir = Path("payloads")
          payload_dir.mkdir(exist_ok=True)
          for old in payload_dir.glob("*.enc"):
              old.unlink()
          payload_name = f"ARGUS-MASTER-16.3.0-{device_id[:16]}.apk.enc"
          (payload_dir / payload_name).write_bytes(ciphertext)

          manifest = {
              "schema": 1,
              "channel": "stable-device-bound",
              "status": "ready",
              "package_name": "com.argus.standalone.main",
              "version_code": 1630000,
              "version_name": "16.3.0-master-local-runtime-foundation",
              "payload_url": f"https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}",
              "ciphertext_sha256": hashlib.sha256(ciphertext).hexdigest(),
              "plaintext_sha256": plaintext_sha,
              "wrapped_key_base64": base64.b64encode(wrapped_key).decode(),
              "nonce_base64": base64.b64encode(nonce).decode(),
              "aad_base64": base64.b64encode(aad).decode(),
              "certificate_sha256": "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0",
              "device_id": device_id,
              "published_at": "2026-07-31T11:20:00+03:00",
              "key_wrap_profile": "RSA-OAEP-SHA256-MGF1-SHA1",
              "release_notes": [
                  "Добавлено локальное ядро Android",
                  "Системный планировщик выполняет read-only цикл каждые 15 минут",
                  "Результаты сохраняются в локальной SQLite-базе",
                  "Добавлена публичная проверка Binance Futures без API-ключа",
                  "Автоматические ордера остаются HARD BLOCKED"
              ]
          }
          Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish encrypted payload only
        run: |
          set -euo pipefail
          rm -rf artifact artifact.zip
          git config user.name "ARGUS Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish encrypted ARGUS 16.3.0 local runtime foundation"
          git push
