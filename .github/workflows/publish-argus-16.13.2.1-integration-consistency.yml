name: Publish encrypted ARGUS 16.13.2.1 INTEGRATION CONSISTENCY

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.13.2.1-integration-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "06a77d075540eef4f2e26c5c1e19f2854146e612"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fbac-81f4-9046-a4c9349b7da9/raw?se=2026-08-02T19:16:25Z&sp=r&sv=2026-02-06&sr=b&scid=8281edeb-46f2-5a38-8cf5-e5c399aa2096&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T07:27:46Z&ske=2026-08-03T07:27:46Z&sks=b&skv=2026-02-06&sig=/YTJGtzrSfxwDugY7O7CHXzQgZbaon%2BB5X3MnY6bYl4%3D' \
            --output /tmp/argus-161321-device-bound.zip
          echo '0a2e44c89167a168b41d429189976233bc3b8ea80c3b857acc4138eebce6dc93  /tmp/argus-161321-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-161321
          mkdir .argus-publish-161321
          unzip -q /tmp/argus-161321-device-bound.zip -d .argus-publish-161321
          test -z "$(find .argus-publish-161321 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-161321')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16013200:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path('payloads/ARGUS-MASTER-16.13.2-bcc61ed52b22f6c8-v16013200.apk.enc')
          if not old_payload.is_file():
              raise SystemExit('Expected 16.13.2 payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != '80e38702f139a640df26a46189ef1d2a7b7801183d6488d3c2800ed7c80a48cf':
              raise SystemExit('Previous payload hash mismatch')
          if current.get('ciphertext_sha256') != '80e38702f139a640df26a46189ef1d2a7b7801183d6488d3c2800ed7c80a48cf':
              raise SystemExit('Unexpected 16.13.2 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16013201,
              'version_name': '16.13.2.1-integration-consistency',
              'ciphertext_sha256': '2b90d077e9685cf25c42d17f245932a055ed9d6dae84931fbcfbd37d02986855',
              'plaintext_sha256': 'b99f4300139fcad807ae993b36fa312e9c51af33e5646ce52b05cf2446a9ca8a',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1424751,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}: {manifest.get(key)!r}')
          payload_name = 'ARGUS-MASTER-16.13.2.1-bcc61ed52b22f6c8-v16013201.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != 'd575b7700cd8573c8cf44e64527665e870bf0dd6':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.13.2.1 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.13.2.1-bcc61ed52b22f6c8-v16013201.apk.enc'
          mkdir -p payloads
          cp .argus-publish-161321/latest.json latest.json
          cp ".argus-publish-161321/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.13.2-bcc61ed52b22f6c8-v16013200.apk.enc
          git rm .github/workflows/publish-argus-16.13.2.1-integration-consistency.yml
          git rm PUBLISH_16.13.2.1_TRIGGER.txt
          rm -rf .argus-publish-161321
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.13.2.1 INTEGRATION CONSISTENCY'
          git push origin HEAD:main
