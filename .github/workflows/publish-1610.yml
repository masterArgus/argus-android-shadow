name: Publish encrypted ARGUS 16.10.0 REMOTE HEALTH RECOVERY
# One-time device-bound publication trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-1610.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout channel
        uses: actions/checkout@v4

      - name: Reassemble and verify encrypted device-bound payload
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.10.0-bcc61ed52b22f6c8.apk.enc"
          mkdir -p payloads
          cat staging/payload-*.b64 | base64 -d > "payloads/$NEW"
          echo "75b97f2715bab43f78efa3a4ef7f1823b38b311c4eb09610ac8b625e318a783a  payloads/$NEW" | sha256sum -c -
          cp staging/latest-1610.json latest.json
          cp staging/health-channel-1610.json health-channel.json
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          health = json.loads(Path("health-channel.json").read_text(encoding="utf-8"))
          payload = Path("payloads/ARGUS-MASTER-16.10.0-bcc61ed52b22f6c8.apk.enc")
          assert manifest["schema"] == 1
          assert manifest["channel"] == "stable-device-bound"
          assert manifest["status"] == "ready"
          assert manifest["package_name"] == "com.argus.standalone.main"
          assert manifest["version_code"] == 1610000
          assert manifest["version_name"] == "16.10.0-master-remote-health-recovery"
          assert manifest["device_id"] == "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          assert manifest["certificate_sha256"] == "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0"
          assert manifest["plaintext_sha256"] == "e3a44416fa1d3e0fa9527d085d659d859f08dfff81a8690817cc1c49744a32a4"
          assert hashlib.sha256(payload.read_bytes()).hexdigest() == manifest["ciphertext_sha256"]
          assert len(base64.b64decode(manifest["wrapped_key_base64"])) == 384
          assert len(base64.b64decode(manifest["nonce_base64"])) == 12
          assert manifest["key_wrap_profile"] == "RSA-OAEP-SHA256-MGF1-SHA1"
          assert health["schema"] == 1
          assert health["purpose"] == "ARGUS_REMOTE_HEALTH"
          assert health["status"] == "awaiting_trusted_receiver"
          assert health["incoming_commands"] is False
          assert "endpoint_url" not in health
          assert "signing_key_sha256" not in health
          assert not list(Path(".").rglob("*.apk"))
          print("ARGUS_16_10_0_DEVICE_BOUND_PUBLICATION PASS")
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.10.0-bcc61ed52b22f6c8.apk.enc"
          find payloads -maxdepth 1 -type f -name '*.enc' ! -name "$NEW" -delete
          git rm .github/workflows/publish-1610.yml
          git rm -r staging
          test ! -e .secure-publish-trigger-1610 || git rm .secure-publish-trigger-1610
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json health-channel.json payloads
          git commit -m "Publish encrypted ARGUS 16.10.0 REMOTE HEALTH RECOVERY"
          git push origin HEAD:main
