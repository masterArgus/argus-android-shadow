name: Publish encrypted ARGUS 16.13.1 PRIME WEEKLY fixed updater

on:
  push:
    branches:
      - agent/publish-argus-16.13.1-prime-weekly-fixed-updater

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-argus-16.13.1-prime-weekly-fixed-updater
          fetch-depth: 0

      - name: Download and verify encrypted device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "60141cc304efb56c65587501c728b00155cf698d"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprukwest.oaiusercontent.com/files/00000000-521c-8243-844b-a535491db819/raw?se=2026-08-02T14:32:07Z&sp=r&sv=2026-02-06&sr=b&scid=91a997fc-9baa-5036-9a5e-e895cf6843c2&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T09:41:15Z&ske=2026-08-03T09:41:15Z&sks=b&skv=2026-02-06&sig=v1a16NaCeY0BK5YAH4qnRjLhWgWau%2BRaKMQGgGhxzII%3D' \
            --output /tmp/argus-16131-device-bound.zip
          echo 'd9532733791c72178565b20279c38ecc6481148b71e30e242434b4235386a7cb  /tmp/argus-16131-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-16131
          mkdir .argus-publish-16131
          unzip -q /tmp/argus-16131-device-bound.zip -d .argus-publish-16131
          test -z "$(find .argus-publish-16131 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16131')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16013002:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path('payloads/ARGUS-MASTER-16.13.0.2-bcc61ed52b22f6c8-v16013002.apk.enc')
          if not old_payload.is_file():
              raise SystemExit('Expected previous encrypted payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get('ciphertext_sha256'):
              raise SystemExit('Previous channel payload hash mismatch')
          if current.get('ciphertext_sha256') != '9746eba59716701a6af29c1873e720bc77720a8e2ed68e1a91490b710d523f0d':
              raise SystemExit('Unexpected 16.13.0.2 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16013100,
              'version_name': '16.13.1-prime-weekly-test-engine',
              'ciphertext_sha256': '6314c268d39674eb798a9b6039903c6f860ed40a43db724575330941b2eb4579',
              'plaintext_sha256': '40dff54229b70bdf2994a98a74bea96d99e0043828bc026e2460d78041019efc',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1417436,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}')
          payload_name = 'ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != '3e1e4a738ebb1d0704bd774d35eea8a6aab28b29':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.13.1 fixed-updater ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16131/latest.json latest.json
          cp ".argus-publish-16131/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.13.0.2-bcc61ed52b22f6c8-v16013002.apk.enc
          git rm .github/workflows/publish-argus-16.13.1-fixed-updater.yml
          rm -rf .argus-publish-16131
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.13.1 PRIME WEEKLY fixed updater'
          git push origin HEAD:main
