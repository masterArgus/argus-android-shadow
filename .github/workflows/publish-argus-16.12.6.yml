name: Publish encrypted ARGUS 16.12.6 LIVE PROJECT PIPELINE

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.12.6-live-project-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify encrypted device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "b60be6d03ef2e1a958567f610a6fbd3bbfee7538"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cec0-81f4-bb41-e60079000d52/raw?se=2026-08-01T18:30:04Z&sp=r&sv=2026-02-06&sr=b&scid=ac5ebe85-294c-52ab-b843-93fc2503fec3&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T06:51:59Z&ske=2026-08-02T06:51:59Z&sks=b&skv=2026-02-06&sig=6ZxNK%2B8N5d9NDpUdTr%2BSH1wwr3syBzqpGnwUKanaGQw%3D' \
            --output /tmp/argus-16126-device-bound.zip
          echo '08a03782d40c1d43a7dce0a15595b4202908d25c59219cfa1f92eea9d1927dee  /tmp/argus-16126-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-16126
          mkdir .argus-publish-16126
          unzip -q /tmp/argus-16126-device-bound.zip -d .argus-publish-16126
          test -z "$(find .argus-publish-16126 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16126')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16012005:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path('payloads/ARGUS-MASTER-16.12.5-bcc61ed52b22f6c8-v16012005.apk.enc')
          if not old_payload.is_file():
              raise SystemExit('Expected previous encrypted payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get('ciphertext_sha256'):
              raise SystemExit('Previous channel payload hash mismatch')
          if current.get('ciphertext_sha256') != '6e7ccea8c4525d648e368aba15330e0c0f575a293359980a2e5dc97725dec85e':
              raise SystemExit('Unexpected 16.12.5 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16012006,
              'version_name': '16.12.6-live-project-pipeline',
              'ciphertext_sha256': '033a26db5dd8e3817cbe23d74cd896cc40e43d0720f9c34f4ffe5913f5b12e9a',
              'plaintext_sha256': '2a74a603456512219d7d92e03cda9ee081f83428d397cb7b9f4f19b160fde3c6',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1392553,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}')
          payload_name = 'ARGUS-MASTER-16.12.6-bcc61ed52b22f6c8-v16012006.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != '294fffa087a11782f9bdbe2af23250c6604ffd8e':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.12.6 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.12.6-bcc61ed52b22f6c8-v16012006.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16126/latest.json latest.json
          cp ".argus-publish-16126/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.12.5-bcc61ed52b22f6c8-v16012005.apk.enc
          git rm .github/workflows/publish-argus-16.12.6.yml
          rm -rf .argus-publish-16126
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.12.6 LIVE PROJECT PIPELINE'
          git push origin HEAD:main
