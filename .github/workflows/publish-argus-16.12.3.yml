name: Publish encrypted ARGUS 16.12.3 GRAND HALL INTERACTIVE WORKSTATIONS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.12.3-grand-hall-interactive-workstations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify encrypted device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "013d77980fe88202814dbfc7e0928fe586e86a2c"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fa80-81f4-bed1-0fc1484a0371/raw?se=2026-08-01T16:59:39Z&sp=r&sv=2026-02-06&sr=b&scid=a6aa0735-48f9-5672-bd85-bc7d6146048d&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T05:01:01Z&ske=2026-08-02T05:01:01Z&sks=b&skv=2026-02-06&sig=zAqSDHPMG3UzKBPbhldXIfFb5bOJILkj3HAb6%2Ba7ve8%3D' \
            --output /tmp/argus-16123-device-bound.zip
          echo 'e1358c0ff7aa93e50d74b5bcf9e58647b67c411e8685b2d1ba4dfdead9de5494  /tmp/argus-16123-device-bound.zip' \
            | sha256sum -c -
          rm -rf .argus-publish-16123
          mkdir .argus-publish-16123
          unzip -q /tmp/argus-16123-device-bound.zip -d .argus-publish-16123
          test -z "$(find .argus-publish-16123 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16123')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16012002:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path(
              'payloads/ARGUS-MASTER-16.12.2-bcc61ed52b22f6c8-v16012002.apk.enc'
          )
          if not old_payload.is_file():
              raise SystemExit('Expected previous encrypted payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get('ciphertext_sha256'):
              raise SystemExit('Previous channel payload hash mismatch')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16012003,
              'version_name': '16.12.3-grand-hall-interactive-workstations',
              'ciphertext_sha256': 'f205ac9c80dce0e835d35c03b7880126d11dbc72115ab256ba80fcc708c95183',
              'plaintext_sha256': 'abfd0145998918dfae0592259422b16bfd5bb48cbd09d4d1950ab6f0247b39c8',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1372133,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}')
          payload_name = (
              'ARGUS-MASTER-16.12.3-bcc61ed52b22f6c8-v16012003.apk.enc'
          )
          expected_url = (
              'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/'
              f'main/payloads/{payload_name}'
          )
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.12.3 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.12.3-bcc61ed52b22f6c8-v16012003.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16123/latest.json latest.json
          cp ".argus-publish-16123/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.12.2-bcc61ed52b22f6c8-v16012002.apk.enc
          git rm .github/workflows/publish-argus-16.12.3.yml
          rm -rf .argus-publish-16123
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.12.3 GRAND HALL INTERACTIVE WORKSTATIONS'
          git push origin HEAD:main
