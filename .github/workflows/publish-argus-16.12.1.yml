name: Publish encrypted ARGUS 16.12.1 GRAND HALL

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.12.1-grand-hall'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify device-bound ciphertext
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "ff090debd0ba615e5b985a77ebea5e40ceec21da"
          test -z "$(git ls-files '*.apk')"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          stage = Path(".argus-publish-16121")
          parts = sorted(stage.glob("payload.part.*.b64"))
          if len(parts) != 7:
              raise SystemExit(f"Expected 7 ciphertext chunks, got {len(parts)}")

          current = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          if current.get("version_code") != 16012000:
              raise SystemExit("Channel base version changed")
          if current.get("device_id") != "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2":
              raise SystemExit("Current channel belongs to another device")
          old_payload = Path(
              "payloads/ARGUS-MASTER-16.12.0-bcc61ed52b22f6c8-v16012000.apk.enc"
          )
          if not old_payload.is_file():
              raise SystemExit("Expected previous encrypted payload is missing")
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get("ciphertext_sha256"):
              raise SystemExit("Previous channel payload hash mismatch")

          manifest = json.loads((stage / "latest.json").read_text(encoding="utf-8"))
          expected = {
              "schema": 1,
              "channel": "stable-device-bound",
              "status": "ready",
              "package_name": "com.argus.standalone.main",
              "version_code": 16012001,
              "version_name": "16.12.1-grand-hall-foundation",
              "ciphertext_sha256": "65ebaabb4bff4e39d3db7b7b0afa29b87d9bd742478128ab5e4604e931947140",
              "plaintext_sha256": "6d43699d2e8bfedca321c21597bb5181813e7df39ced81f9a137b5f1128a6338",
              "certificate_sha256": "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0",
              "device_id": "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2",
              "key_wrap_profile": "RSA-OAEP-SHA256-MGF1-SHA1",
              "payload_size": 1358215,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Manifest mismatch for {key}")

          payload_name = "ARGUS-MASTER-16.12.1-bcc61ed52b22f6c8-v16012001.apk.enc"
          expected_url = (
              "https://raw.githubusercontent.com/masterArgus/argus-android-shadow/"
              f"main/payloads/{payload_name}"
          )
          if manifest.get("payload_url") != expected_url:
              raise SystemExit("Manifest payload URL mismatch")

          payload_dir = Path("payloads")
          payload_dir.mkdir(exist_ok=True)
          payload_path = payload_dir / payload_name
          with payload_path.open("wb") as target:
              for part in parts:
                  target.write(base64.b64decode(part.read_text(encoding="ascii"), validate=True))

          if payload_path.stat().st_size != expected["payload_size"]:
              raise SystemExit("Reconstructed ciphertext size mismatch")
          digest = hashlib.sha256(payload_path.read_bytes()).hexdigest()
          if digest != expected["ciphertext_sha256"]:
              raise SystemExit("Reconstructed ciphertext SHA-256 mismatch")
          print("ARGUS 16.12.1 device-bound ciphertext: PASS")
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cp .argus-publish-16121/latest.json latest.json
          git rm -f payloads/ARGUS-MASTER-16.12.0-bcc61ed52b22f6c8-v16012000.apk.enc
          git rm -r .argus-publish-16121
          git rm .github/workflows/publish-argus-16.12.1.yml
          git add latest.json payloads/ARGUS-MASTER-16.12.1-bcc61ed52b22f6c8-v16012001.apk.enc
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish encrypted ARGUS 16.12.1 GRAND HALL"
          git push origin HEAD:main
