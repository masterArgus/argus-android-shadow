name: Publish encrypted ARGUS 16.12.7 MASTER PROJECT REVIEW MEMORY

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.12.7-master-project-review-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify encrypted device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "33f0ebd7ba21a176d4f6c23c9b93221ad7cd8d77"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-dad4-81f4-a12d-96eec1c9d172/raw?se=2026-08-01T20:12:53Z&sp=r&sv=2026-02-06&sr=b&scid=e98a2931-a8b4-56b8-a675-2ba8ca4ee986&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T05:49:07Z&ske=2026-08-02T05:49:07Z&sks=b&skv=2026-02-06&sig=Y3NrfgR28UP2uvxL6gcEWBOmrL7csp6Rf77oLxmsVVA%3D' \
            --output /tmp/argus-16127-device-bound.zip
          echo 'e5ef8201751376fe0c1afd0c84204ca5bee1dd5dc1ac4be651b8c8d3af018c05  /tmp/argus-16127-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-16127
          mkdir .argus-publish-16127
          unzip -q /tmp/argus-16127-device-bound.zip -d .argus-publish-16127
          test -z "$(find .argus-publish-16127 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16127')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16012006:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path('payloads/ARGUS-MASTER-16.12.6-bcc61ed52b22f6c8-v16012006.apk.enc')
          if not old_payload.is_file():
              raise SystemExit('Expected previous encrypted payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get('ciphertext_sha256'):
              raise SystemExit('Previous channel payload hash mismatch')
          if current.get('ciphertext_sha256') != '033a26db5dd8e3817cbe23d74cd896cc40e43d0720f9c34f4ffe5913f5b12e9a':
              raise SystemExit('Unexpected 16.12.6 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16012007,
              'version_name': '16.12.7-master-project-review-memory',
              'ciphertext_sha256': '30082f8f80553bbcb3b65b0797735356a53c824321b634eaff03ae111363242a',
              'plaintext_sha256': 'cf5596e1377668e6745d8be9ba1fd826b8ee79c68b1c359157dfc2fb68c58971',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1366907,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}')
          payload_name = 'ARGUS-MASTER-16.12.7-bcc61ed52b22f6c8-v16012007.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != 'fbb3205a57af6892b2cb6b504235fccd95dc3f2c':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.12.7 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.12.7-bcc61ed52b22f6c8-v16012007.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16127/latest.json latest.json
          cp ".argus-publish-16127/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.12.6-bcc61ed52b22f6c8-v16012006.apk.enc
          git rm .github/workflows/publish-argus-16.12.7.yml
          rm -rf .argus-publish-16127
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.12.7 MASTER PROJECT REVIEW MEMORY'
          git push origin HEAD:main
