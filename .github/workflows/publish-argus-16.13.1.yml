name: Publish encrypted ARGUS 16.13.1 PRIME WEEKLY TEST ENGINE

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.13.1-prime-weekly-test-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact one-time publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          python3 -m pip install --disable-pip-version-check cryptography

      - name: Download and verify protected CI artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "35e2908a957fa27b5807bfd0eab666a5c8521409"
          test -z "$(git ls-files '*.apk')"
          URL='https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5660-8246-ba06-6be3458a9153/raw?se=2026-08-02T12:47:07Z&sp=r&sv=2026-02-06&sr=b&scid=88276f84-569e-57e4-a811-dff302794d83&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T06:14:08Z&ske=2026-08-03T06:14:08Z&sks=b&skv=2026-02-06&sig=bGfF6KO3/4/SlSZo1YCcvWUHfGzicix4Yll2gTaHLpk%3D'
          curl --fail --location --retry 4 --retry-delay 1 "$URL" -o /tmp/argus-16131.zip
          echo 'cdc1879fd4cbda5ad04eabd00bc97de82a3887a590226412f92e93e03e0b17da  /tmp/argus-16131.zip' | sha256sum -c -
          rm -rf /tmp/argus-16131
          mkdir /tmp/argus-16131
          unzip -q /tmp/argus-16131.zip -d /tmp/argus-16131
          APK='/tmp/argus-16131/ARGUS-16.13.1-PRIME-WEEKLY-TEST-ENGINE.apk'
          test -f "$APK"
          echo '0881797bd7927b661459119eb4a52fc54ebc021123f769b38b5dcc04d1b38896  /tmp/argus-16131/ARGUS-16.13.1-PRIME-WEEKLY-TEST-ENGINE.apk' | sha256sum -c -
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.argus.standalone.main'" /tmp/badging.txt
          grep -q "versionCode='16013100'" /tmp/badging.txt
          grep -q "versionName='16.13.1-prime-weekly-test-engine'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signature.txt
          CERT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' /tmp/signature.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$CERT" = 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/tmp/alignment.txt

      - name: Verify current channel and encrypt for registered tablet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          expected_device = 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2'
          expected_cert = 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          if current.get('version_code') != 16012008:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != expected_device:
              raise SystemExit('Channel device changed')
          if current.get('certificate_sha256') != expected_cert:
              raise SystemExit('Channel certificate changed')
          if current.get('ciphertext_sha256') != '1ebecb140b4c53a751fa2969734effd41f4bea5062b42c195eb9e0f931c0e9e5':
              raise SystemExit('Previous ciphertext hash changed')
          old = Path('payloads/ARGUS-MASTER-16.12.8-bcc61ed52b22f6c8-v16012008.apk.enc')
          if not old.is_file() or hashlib.sha256(old.read_bytes()).hexdigest() != current['ciphertext_sha256']:
              raise SystemExit('Previous encrypted payload mismatch')

          public_pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA01MP53jzEzujpxxw5oXU
          ENsszGeq69DLwQLZQ6SWZ/ighUKcRvfSaPMj8ZT/o2CX5VeL6bc595xRFH85szC9
          XoOgD4C+R55iRKOvV9vAJAlsFWCsgWFYfiCEJE4lR8CmoUuUEcBYRwQ4pC4+j/nK
          OGLDRU8aG8NBoY+QCvprc7w+k09C+O9D48msfHWUEZCDPGlyeRDjYaVfKeNswLcm
          xj/Pqs808ChtDkp03fARCGE2UHw273a/3wjX8KjQeAIoMLSiqWY8z99Cx1SI4psi
          WescaJCFZp4Qf767v/79/FVItDXMyOD+ELHksWBA0734rhMVdycvRaGMsou8On4W
          2JtFP9Sd2bk8GY7a3JxfLx8P2BpZGXJs2rwc0HU+lXKidTcGeH7uJX2uAGunom5N
          M6DeMyLWnmRjKy9/hNDfEvtPBencvJ5d7NMgcMre3ZFCStx68JeqLrmE2wAWTu8n
          Z4xDa9dL/foQ3WfGeKbn21G9nllmW3kzPzlyHoGUF2bbAgMBAAE=
          -----END PUBLIC KEY-----
          '''.replace(b'          ', b'')
          key = serialization.load_pem_public_key(public_pem)
          if key.key_size != 3072:
              raise SystemExit('Unexpected tablet key size')
          apk = Path('/tmp/argus-16131/ARGUS-16.13.1-PRIME-WEEKLY-TEST-ENGINE.apk').read_bytes()
          plain_sha = hashlib.sha256(apk).hexdigest()
          if plain_sha != '0881797bd7927b661459119eb4a52fc54ebc021123f769b38b5dcc04d1b38896':
              raise SystemExit('Plain APK hash changed')
          package = 'com.argus.standalone.main'
          version_code = 16013100
          version_name = '16.13.1-prime-weekly-test-engine'
          payload_name = 'ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc'
          aad = f'ARGUS|stable-device-bound|{package}|{version_code}|{expected_device}'.encode()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, apk, aad)
          if AESGCM(aes_key).decrypt(nonce, ciphertext, aad) != apk:
              raise SystemExit('AES-GCM round-trip failed')
          wrapped = key.encrypt(aes_key, padding.OAEP(
              mgf=padding.MGF1(algorithm=hashes.SHA1()),
              algorithm=hashes.SHA256(), label=None))
          if len(wrapped) != 384:
              raise SystemExit('Unexpected wrapped key size')
          payload = Path('payloads') / payload_name
          payload.parent.mkdir(exist_ok=True)
          payload.write_bytes(ciphertext)
          manifest = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': package,
              'version_code': version_code,
              'version_name': version_name,
              'payload_url': 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name,
              'payload_size': len(ciphertext),
              'ciphertext_sha256': hashlib.sha256(ciphertext).hexdigest(),
              'plaintext_sha256': plain_sha,
              'wrapped_key_base64': base64.b64encode(wrapped).decode('ascii'),
              'nonce_base64': base64.b64encode(nonce).decode('ascii'),
              'aad_base64': base64.b64encode(aad).decode('ascii'),
              'certificate_sha256': expected_cert,
              'device_id': expected_device,
              'published_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'release_notes': [
                  'Добавлены 10 независимых недельных тестовых периодов по 7 полных суток',
                  'Каждый период использует ровно 10080 закрытых свечей 1m из публичного Binance USD-M Futures',
                  'PRIME сравнивает плечи 5×, 10×, 20×, 50× и 100× в isolated stress-режиме',
                  'Симулятор учитывает комиссии maker/taker, funding, проскальзывание и ликвидацию',
                  'Реализована ступенчатая схема 25%–50%–25% с остатком 25% после разворота',
                  'Dataset, конфигурация, контекст проекта, журнал и результаты защищены SHA-256',
                  'Результаты и события сохраняются в отдельной базе argus_prime_weekly.db',
                  'Экран Разработка открывает PRIME Weekly Test Engine с прогрессом, журналом и повтором периода',
                  'Диагностика и recovery включают новую недельную базу',
                  'Реальные и автоматические ордера остаются HARD BLOCKED; execution capability равна 0'
              ]
          }
          Path('latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          proof = {
              'source_commit': 'efd1630192e73f5381aabf97ac6957f4cb333e31',
              'build_run_id': 30748045292,
              'artifact_id': 8833524868,
              'artifact_zip_sha256': 'cdc1879fd4cbda5ad04eabd00bc97de82a3887a590226412f92e93e03e0b17da',
              'plaintext_sha256': plain_sha,
              'ciphertext_sha256': manifest['ciphertext_sha256'],
              'payload_size': len(ciphertext),
              'certificate_sha256': expected_cert,
              'device_id': expected_device,
              'aes_gcm_round_trip': 'PASS',
              'rsa_key_bits': key.key_size,
              'key_wrap_profile': manifest['key_wrap_profile']
          }
          Path('/tmp/proof-16131.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY

      - name: Atomically publish ciphertext and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          NEW='payloads/ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc'
          OLD='payloads/ARGUS-MASTER-16.12.8-bcc61ed52b22f6c8-v16012008.apk.enc'
          test -f "$NEW"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          payload=Path('payloads/ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc')
          proof=json.loads(Path('/tmp/proof-16131.json').read_text())
          assert manifest['version_code'] == 16013100
          assert manifest['payload_size'] == payload.stat().st_size
          assert manifest['ciphertext_sha256'] == hashlib.sha256(payload.read_bytes()).hexdigest()
          assert manifest['plaintext_sha256'] == '0881797bd7927b661459119eb4a52fc54ebc021123f769b38b5dcc04d1b38896'
          assert proof['aes_gcm_round_trip'] == 'PASS'
          assert proof['rsa_key_bits'] == 3072
          print('ARGUS 16.13.1 device-bound publication verification: PASS')
          PY
          git rm -f "$OLD"
          git rm .github/workflows/publish-argus-16.13.1.yml
          git add latest.json "$NEW"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.13.1 PRIME WEEKLY TEST ENGINE'
          git push origin HEAD:main
