name: Publish encrypted ARGUS 16.12.5 GALA PROJECT CONSTRUCTOR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.12.5-gala-project-constructor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify encrypted device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "7ba2b8639046d0d4c77ef15b2d6413d1df25e7f6"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5ef0-81f4-bf97-fe27f234177e/raw?se=2026-08-01T18:00:11Z&sp=r&sv=2026-02-06&sr=b&scid=77208cc2-7d83-5519-9fa0-8987677b9363&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T23:45:02Z&ske=2026-08-02T23:45:02Z&sks=b&skv=2026-02-06&sig=JRQsn7pJmJreQLH6Y7IRVixWwCwdFMIphqiNt7olXLg%3D' \
            --output /tmp/argus-16125-device-bound.zip
          echo '693a821ff8e8be1da66cb6fa76193f5153e8cb1424f67c7668d87855ef0e1342  /tmp/argus-16125-device-bound.zip' \
            | sha256sum -c -
          rm -rf .argus-publish-16125
          mkdir .argus-publish-16125
          unzip -q /tmp/argus-16125-device-bound.zip -d .argus-publish-16125
          test -z "$(find .argus-publish-16125 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16125')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          expected_device = 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2'
          if current.get('version_code') != 16012004:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != expected_device:
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path(
              'payloads/ARGUS-MASTER-16.12.4-bcc61ed52b22f6c8-v16012004.apk.enc'
          )
          if not old_payload.is_file():
              raise SystemExit('Expected previous encrypted payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get('ciphertext_sha256'):
              raise SystemExit('Previous channel payload hash mismatch')
          if current.get('ciphertext_sha256') != 'a6c964c82d12245990c0d4e6790f8d3e1bee7efa2c75be684003ba39ea39c9da':
              raise SystemExit('Unexpected 16.12.4 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16012005,
              'version_name': '16.12.5-gala-project-constructor',
              'ciphertext_sha256': '6e7ccea8c4525d648e368aba15330e0c0f575a293359980a2e5dc97725dec85e',
              'plaintext_sha256': 'e7611c0fd5c101ebf3bc83722087e9fd0261d2b1a8e4fff44411b58b65b9b7cf',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': expected_device,
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1382756,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}')
          payload_name = (
              'ARGUS-MASTER-16.12.5-bcc61ed52b22f6c8-v16012005.apk.enc'
          )
          expected_url = (
              'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/'
              f'main/payloads/{payload_name}'
          )
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file():
              raise SystemExit('New encrypted payload missing')
          if payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != 'ed7335b5ae4cc4d2597389c5de13c4612aa1462f':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.12.5 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.12.5-bcc61ed52b22f6c8-v16012005.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16125/latest.json latest.json
          cp ".argus-publish-16125/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.12.4-bcc61ed52b22f6c8-v16012004.apk.enc
          git rm .github/workflows/publish-argus-16.12.5.yml
          rm -rf .argus-publish-16125
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.12.5 GALA PROJECT CONSTRUCTOR'
          git push origin HEAD:main
