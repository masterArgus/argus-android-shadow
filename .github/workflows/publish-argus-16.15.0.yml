name: Publish encrypted ARGUS 16.15.0

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/publish-argus-16.15.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "e534e25ca6e29e802e32c317ea05d1482f4fc26c"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-cd20-8246-b34f-c66edc6ac9a2/raw?se=2026-08-07T07%3A50%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=b3ec81a0-8087-5973-ac8a-60e0bb4c3acc&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T07%3A09%3A36Z&ske=2026-08-08T07%3A09%3A36Z&sks=b&skv=2026-02-06&sig=ejcHpJXNXDUKzAIQLFLCQfpTtQ9Ru5ytsyhhbGkDRYQ%3D' \
            --output /tmp/argus-16150-device-bound.zip
          echo '96c245d8f430e94c0e04a1e95269c2d2abcea180e6663a5df7647d2036eadfbf  /tmp/argus-16150-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-16150
          mkdir .argus-publish-16150
          unzip -q /tmp/argus-16150-device-bound.zip -d .argus-publish-16150
          test -z "$(find .argus-publish-16150 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          stage=Path('.argus-publish-16150')
          current=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16014001: raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2': raise SystemExit('Wrong current device')
          old=Path('payloads/ARGUS-MASTER-16.14.1-bcc61ed52b22f6c8-v16014001.apk.enc')
          old_hash='0e65d4b69d94dc08f82d92ba3fcbd9f07355230dcd9baea3bc98864cb463dd76'
          if not old.is_file() or hashlib.sha256(old.read_bytes()).hexdigest()!=old_hash: raise SystemExit('Previous payload mismatch')
          if current.get('ciphertext_sha256') != old_hash: raise SystemExit('Unexpected current channel hash')
          manifest=json.loads((stage/'latest.json').read_text(encoding='utf-8'))
          proof=json.loads((stage/'proof.json').read_text(encoding='utf-8'))
          expected={
            'schema':1,'channel':'stable-device-bound','status':'ready',
            'package_name':'com.argus.standalone.main','version_code':16015005,
            'version_name':'16.15.0','payload_size':1410631,
            'ciphertext_sha256':'cad6bdd61bc43c84ee568e3bc4fefd87315358cb704c50c306a23c8fe849dc6d',
            'plaintext_sha256':'b426a2dbd96daa2a51424768fa6e5a20bf85af980a768d8f5e758228f92f75e3',
            'certificate_sha256':'d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
            'device_id':'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
            'key_wrap_profile':'RSA-OAEP-SHA256-MGF1-SHA1'}
          for k,v in expected.items():
            if manifest.get(k)!=v: raise SystemExit(f'Manifest mismatch {k}')
          payload_name='ARGUS-MASTER-16.15.0-bcc61ed52b22f6c8-v16015005.apk.enc'
          if manifest.get('payload_url')!='https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/'+payload_name: raise SystemExit('Payload URL mismatch')
          payload=stage/payload_name
          if not payload.is_file() or payload.stat().st_size!=expected['payload_size']: raise SystemExit('Cipher size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest()!=expected['ciphertext_sha256']: raise SystemExit('Cipher hash mismatch')
          for k in ('plaintext_sha256','ciphertext_sha256','payload_size','certificate_sha256','device_id','key_wrap_profile'):
            if proof.get(k)!=expected[k]: raise SystemExit(f'Proof mismatch {k}')
          if proof.get('source_commit')!='e0a96bed5960367b01bee4af694299ba7f23bb04': raise SystemExit('Unexpected source commit')
          if proof.get('aes_gcm_round_trip')!='PASS' or proof.get('rsa_key_bits')!=3072: raise SystemExit('Encryption proof failed')
          if proof.get('release_status')!='ready': raise SystemExit('Release status blocked')
          print('ARGUS 16.15.0 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.15.0-bcc61ed52b22f6c8-v16015005.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16150/latest.json latest.json
          cp ".argus-publish-16150/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.14.1-bcc61ed52b22f6c8-v16014001.apk.enc
          git rm .github/workflows/publish-argus-16.15.0.yml
          git rm PUBLISH_16.15.0_TRIGGER.txt
          rm -rf .argus-publish-16150
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.15.0'
          git push origin HEAD:main
