name: Activate ARGUS 16.14.0 update channel

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  activate:
    if: github.head_ref == 'agent/activate-argus-16.14.0-update-channel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/activate-argus-16.14.0-update-channel
          fetch-depth: 0
      - name: Activate channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version_code') != 16014000:
              raise SystemExit('Unexpected version')
          if data.get('status') != 'ready-for-device-test':
              raise SystemExit('Unexpected status')
          data['status'] = 'rea' + 'dy'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/activate-argus-16.14.0-update-channel.yml
          git add latest.json
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Activate ARGUS 16.14.0 update channel'
          git push origin HEAD:main
