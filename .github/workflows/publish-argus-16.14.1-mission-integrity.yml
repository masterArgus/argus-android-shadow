name: Publish encrypted ARGUS 16.14.1 MISSION INTEGRITY

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.14.1-mission-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "ea5bd46edbbed4ac5e98abaac7c3976c40858dcf"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f5f4-81f4-a886-87dfd8cf5d13/raw?se=2026-08-03T11:26:47Z&sp=r&sv=2026-02-06&sr=b&scid=72cdbedc-15b4-5020-a1a0-b6622e47d02f&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T11:06:42Z&ske=2026-08-04T11:06:42Z&sks=b&skv=2026-02-06&sig=/uhZd/lAaQQ/X68l%2BVJKYgx7HexMLIUtKxzkd5/JBHk%3D' \
            --output /tmp/argus-16141-device-bound.zip
          echo '0b04a6090b48baad71441377b054eedf1a65be05c04253465bcaf64ab1195754  /tmp/argus-16141-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-16141
          mkdir .argus-publish-16141
          unzip -q /tmp/argus-16141-device-bound.zip -d .argus-publish-16141
          test -z "$(find .argus-publish-16141 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16141')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16014000:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path('payloads/ARGUS-MASTER-16.14.0-bcc61ed52b22f6c8-v16014000.apk.enc')
          if not old_payload.is_file():
              raise SystemExit('Expected 16.14.0 payload is missing')
          old_hash = '6f40ddbfa94dfc84cdc3a4faf3b6176e307305b6ed44222248805cbe0de241d5'
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != old_hash:
              raise SystemExit('Previous payload hash mismatch')
          if current.get('ciphertext_sha256') != old_hash:
              raise SystemExit('Unexpected 16.14.0 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16014001,
              'version_name': '16.14.1-demo-prime-mission-integrity',
              'ciphertext_sha256': '0e65d4b69d94dc08f82d92ba3fcbd9f07355230dcd9baea3bc98864cb463dd76',
              'plaintext_sha256': 'd212c5cfb6d10b7ce609081626bf564bcef8a3bf6ce76b5bc2dade719a301674',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1446555,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}: {manifest.get(key)!r}')
          payload_name = 'ARGUS-MASTER-16.14.1-bcc61ed52b22f6c8-v16014001.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != 'bbc96d73a59f504f879fea6cc5c01c3947ee10cf':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          if proof.get('release_status') != 'ready':
              raise SystemExit('Updater-incompatible release status')
          print('ARGUS 16.14.1 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.14.1-bcc61ed52b22f6c8-v16014001.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16141/latest.json latest.json
          cp ".argus-publish-16141/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.14.0-bcc61ed52b22f6c8-v16014000.apk.enc
          git rm .github/workflows/publish-argus-16.14.1-mission-integrity.yml
          git rm PUBLISH_16.14.1_TRIGGER.txt
          rm -rf .argus-publish-16141
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.14.1 MISSION INTEGRITY'
          git push origin HEAD:main
