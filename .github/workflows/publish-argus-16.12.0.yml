name: Publish ARGUS 16.12.0 device-bound update

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reassemble and verify encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.12.0-bcc61ed52b22f6c8-v16012000.apk.enc"
          WORK="$RUNNER_TEMP/argus-16120"
          mkdir -p "$WORK"
          cat staging-16120/payload-* | base64 -d > "$WORK/$NEW"
          echo "54867fccbbd6ab917d3990bd712250b6a8f4f05ec3769d7f7f0374c907151bbf  $WORK/$NEW" | sha256sum -c -
          cp staging-16120/latest-16120.json "$WORK/latest.json"
          python3 - "$WORK" <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path
          work=Path(sys.argv[1]); manifest=json.loads((work/'latest.json').read_text())
          payload=work/'ARGUS-MASTER-16.12.0-bcc61ed52b22f6c8-v16012000.apk.enc'
          assert manifest['schema']==1 and manifest['channel']=='stable-device-bound'
          assert manifest['status']=='ready'
          assert manifest['package_name']=='com.argus.standalone.main'
          assert manifest['version_code']==16012000 and manifest['version_code']>16011001
          assert manifest['version_name']=='16.12.0-futures-facts-execution-grid'
          assert manifest['device_id']=='bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2'
          assert manifest['certificate_sha256']=='d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          assert manifest['plaintext_sha256']=='83215df5883efb86129e4a01465020304887e7512d9c3829e0d4148839e7a439'
          assert hashlib.sha256(payload.read_bytes()).hexdigest()==manifest['ciphertext_sha256']
          assert len(base64.b64decode(manifest['wrapped_key_base64']))==384
          assert len(base64.b64decode(manifest['nonce_base64']))==12
          assert manifest['key_wrap_profile']=='RSA-OAEP-SHA256-MGF1-SHA1'
          print('ARGUS_16_12_0_DEVICE_BOUND_PUBLICATION PASS')
          PY
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo "Open APK must never enter the update channel" >&2
            exit 1
          fi
      - name: Atomically publish from current main
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.12.0-bcc61ed52b22f6c8-v16012000.apk.enc"
          WORK="$RUNNER_TEMP/argus-16120"
          git fetch origin main
          git checkout -B publish-main origin/main
          CURRENT="$(python3 -c 'import json;print(json.load(open("latest.json"))["version_code"])')"
          test 16012000 -gt "$CURRENT"
          mkdir -p payloads
          find payloads -maxdepth 1 -type f -name '*.enc' ! -name "$NEW" -delete
          cp "$WORK/$NEW" "payloads/$NEW"
          cp "$WORK/latest.json" latest.json
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish encrypted ARGUS 16.12.0 futures facts execution grid"
          git push origin HEAD:main
