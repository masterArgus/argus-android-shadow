name: Publish verified ARGUS 16.24.1 device-bound candidate

on:
  push:
    paths:
      - 'release-candidates/16.24.1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify candidate and atomically promote encrypted update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import urllib.request
          import zipfile

          expected_outer = "d73cee20b107205f8cab2ea387655a6f91961e3b1a2766d34df6aa7f2e783f1d"
          expected_inner = "8e7bd07c103463c985ee603fec9f97651f5bbfbc072f45c7fda8151bdd69f7a3"
          expected_cipher = "0ee2164b32088bce630c78c29051619b41941ef7b477ba70c94205ce7b603050"
          stage = pathlib.Path("release-candidates/16.24.1.json")
          if not stage.is_file():
              raise SystemExit("Candidate descriptor unavailable")
          job = json.loads(stage.read_text())
          url = job["artifact_zip_url"]
          if not url.startswith("https://") or ".oaiusercontent.com/" not in url:
              raise SystemExit("Candidate download URL outside expected host")
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "ARGUS-publisher"}), timeout=60) as resp:
              outer_bytes = resp.read(5_000_001)
          if len(outer_bytes) > 5_000_000 or hashlib.sha256(outer_bytes).hexdigest() != expected_outer:
              raise SystemExit("CI artifact hash mismatch")
          with zipfile.ZipFile(io.BytesIO(outer_bytes)) as outer:
              if outer.namelist() != ["ARGUS-16.24.1-DEVICE-BOUND-BUNDLE.zip"]:
                  raise SystemExit("Unexpected artifact member")
              inner_bytes = outer.read(outer.namelist()[0])
          if hashlib.sha256(inner_bytes).hexdigest() != expected_inner:
              raise SystemExit("Device bundle hash mismatch")
          with zipfile.ZipFile(io.BytesIO(inner_bytes)) as bundle:
              names = bundle.namelist()
              if len(names) != 3 or not {"latest.json", "proof.json"}.issubset(names):
                  raise SystemExit("Unexpected encrypted bundle structure")
              manifest = json.loads(bundle.read("latest.json"))
              proof = json.loads(bundle.read("proof.json"))
              name = pathlib.PurePosixPath(manifest["payload_url"]).name
              if name not in names:
                  raise SystemExit("Missing encrypted payload")
              enc = bundle.read(name)
          old = json.loads(pathlib.Path("latest.json").read_text())
          if old["version_code"] != 16024000:
              raise SystemExit("Unexpected active channel version, refusing promotion")
          if (manifest["version_code"] != 16024001
              or manifest["version_name"] != "16.24.1"
              or manifest["schema"] != 1
              or manifest["status"] != "ready"
              or manifest["channel"] != "stable-device-bound"
              or manifest["package_name"] != old["package_name"]
              or manifest["device_id"] != old["device_id"]
              or manifest["certificate_sha256"] != old["certificate_sha256"]
              or manifest["ciphertext_sha256"] != expected_cipher
              or manifest["payload_size"] != len(enc)
              or hashlib.sha256(enc).hexdigest() != expected_cipher
              or proof["ciphertext_sha256"] != expected_cipher
              or manifest["payload_url"] != "https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/" + name):
              raise SystemExit("Candidate metadata/integrity mismatch")
          payload = pathlib.Path("payloads") / name
          if payload.exists():
              raise SystemExit("Refusing to overwrite existing payload")
          payload.parent.mkdir(parents=True, exist_ok=True)
          payload.write_bytes(enc)
          pathlib.Path("latest.json").write_bytes(bundle.read("latest.json") if False else (json.dumps(manifest, ensure_ascii=False, indent=2) + "\n").encode("utf-8"))
          stage.unlink()
          print("ARGUS 16.24.1 verified, encrypted payload and manifest staged for one commit")
          PY
          git config user.name 'ARGUS Verified Release'
          git config user.email 'actions@users.noreply.github.com'
          git add -A latest.json payloads release-candidates/16.24.1.json
          git commit -m 'Publish verified device-bound ARGUS 16.24.1 update'
          git push origin HEAD:main
