name: Publish encrypted ARGUS 16.12.8 MASTER FEEDBACK CALIBRATED MEMORY

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.12.8-master-feedback-calibrated-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify encrypted device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "e9efb641d40335e83a1fe8242c19936deaef6ee8"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-f2d0-8246-8fd3-d0877ab2d08a/raw?se=2026-08-02T04:28:48Z&sp=r&sv=2026-02-06&sr=b&scid=a903af68-5bf5-5cc1-9ccd-32575c4be99e&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T23:45:06Z&ske=2026-08-03T23:45:06Z&sks=b&skv=2026-02-06&sig=3vQ8vQDyonOA9Un%2B1nEj0%2Bu5pCpyvXo601cJbpF/qO4%3D' \
            --output /tmp/argus-16128-device-bound.zip
          echo 'd49b24b714ba9f0be32e739746ac22eff530500a4d2483aece5e6c51a57b073f  /tmp/argus-16128-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-16128
          mkdir .argus-publish-16128
          unzip -q /tmp/argus-16128-device-bound.zip -d .argus-publish-16128
          test -z "$(find .argus-publish-16128 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-16128')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16012007:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_payload = Path('payloads/ARGUS-MASTER-16.12.7-bcc61ed52b22f6c8-v16012007.apk.enc')
          if not old_payload.is_file():
              raise SystemExit('Expected previous encrypted payload is missing')
          if hashlib.sha256(old_payload.read_bytes()).hexdigest() != current.get('ciphertext_sha256'):
              raise SystemExit('Previous channel payload hash mismatch')
          if current.get('ciphertext_sha256') != '30082f8f80553bbcb3b65b0797735356a53c824321b634eaff03ae111363242a':
              raise SystemExit('Unexpected 16.12.7 channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16012008,
              'version_name': '16.12.8-master-feedback-calibrated-memory',
              'ciphertext_sha256': '1ebecb140b4c53a751fa2969734effd41f4bea5062b42c195eb9e0f931c0e9e5',
              'plaintext_sha256': 'f5463199c6ad9e2f49beecf5f7cc9a1989b8b7d6b84a62e58324238920162881',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1376652,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}')
          payload_name = 'ARGUS-MASTER-16.12.8-bcc61ed52b22f6c8-v16012008.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != '49b359c378df657011f3f4e938a7a2cb21c24381':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.12.8 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.12.8-bcc61ed52b22f6c8-v16012008.apk.enc'
          mkdir -p payloads
          cp .argus-publish-16128/latest.json latest.json
          cp ".argus-publish-16128/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f payloads/ARGUS-MASTER-16.12.7-bcc61ed52b22f6c8-v16012007.apk.enc
          git rm .github/workflows/publish-argus-16.12.8.yml
          rm -rf .argus-publish-16128
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.12.8 MASTER FEEDBACK CALIBRATED MEMORY'
          git push origin HEAD:main
