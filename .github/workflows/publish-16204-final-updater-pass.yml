name: Publish ARGUS 16.2.4 Final Updater PASS

on:
  push:
    paths:
      - .github/workflows/publish-16204-final-updater-pass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==45.0.5

      - name: Download verified private ARGUS artifact
        env:
          ARGUS_ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-05dc-8211-9253-80d4f61d38b3/raw?se=2026-07-31T07:29:55Z&sp=r&sv=2026-02-06&sr=b&scid=29acbfa4-911e-51d8-89cf-34567365bdf4&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T02:06:46Z&ske=2026-08-02T02:06:46Z&sks=b&skv=2026-02-06&sig=aBC%2BAzQaCmnz%2BKALwUlMXHXk%2BvnoMSpoAY5NGsihLXo%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARGUS_ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name 'ARGUS-MASTER-16.2.4-Device-Bound-Updater-PASS.apk' | head -n1)"
          test -f "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "c978cbe81828893123cf5bf56745d0f310dc90e44d46be18f5f6b0bb68be6e50  $APK" | sha256sum -c -

      - name: Encrypt only for registered tablet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, base64, hashlib, os
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          public_key_pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA01MP53jzEzujpxxw5oXU
          ENsszGeq69DLwQLZQ6SWZ/ighUKcRvfSaPMj8ZT/o2CX5VeL6bc595xRFH85szC9
          XoOgD4C+R55iRKOvV9vAJAlsFWCsgWFYfiCEJE4lR8CmoUuUEcBYRwQ4pC4+j/nK
          OGLDRU8aG8NBoY+QCvprc7w+k09C+O9D48msfHWUEZCDPGlyeRDjYaVfKeNswLcm
          xj/Pqs808ChtDkp03fARCGE2UHw273a/3wjX8KjQeAIoMLSiqWY8z99Cx1SI4psi
          WescaJCFZp4Qf767v/79/FVItDXMyOD+ELHksWBA0734rhMVdycvRaGMsou8On4W
          2JtFP9Sd2bk8GY7a3JxfLx8P2BpZGXJs2rwc0HU+lXKidTcGeH7uJX2uAGunom5N
          M6DeMyLWnmRjKy9/hNDfEvtPBencvJ5d7NMgcMre3ZFCStx68JeqLrmE2wAWTu8n
          Z4xDa9dL/foQ3WfGeKbn21G9nllmW3kzPzlyHoGUF2bbAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          public_key_pem = b'\n'.join(line.strip() for line in public_key_pem.splitlines() if line.strip()) + b'\n'
          public_key = serialization.load_pem_public_key(public_key_pem)
          der = public_key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == device_id

          apk = Path(os.environ['APK'])
          plaintext = apk.read_bytes()
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          assert plaintext_sha == 'c978cbe81828893123cf5bf56745d0f310dc90e44d46be18f5f6b0bb68be6e50'

          aes_key = os.urandom(32)
          nonce = os.urandom(12)
          aad = b'ARGUS|stable-device-bound|com.argus.standalone.main|1620400|' + device_id.encode()
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(mgf=padding.MGF1(hashes.SHA1()), algorithm=hashes.SHA256(), label=None),
          )

          payload_name = f'ARGUS-MASTER-16.2.4-{device_id[:16]}.apk.enc'
          payload_dir = Path('payloads')
          payload_dir.mkdir(exist_ok=True)
          (payload_dir / payload_name).write_bytes(ciphertext)

          manifest = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': 'com.argus.standalone.main',
              'version_code': 1620400,
              'version_name': '16.2.4-master-device-bound-updater-pass',
              'payload_url': f'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}',
              'ciphertext_sha256': hashlib.sha256(ciphertext).hexdigest(),
              'plaintext_sha256': plaintext_sha,
              'wrapped_key_base64': base64.b64encode(wrapped_key).decode(),
              'nonce_base64': base64.b64encode(nonce).decode(),
              'aad_base64': base64.b64encode(aad).decode(),
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': device_id,
              'published_at': '2026-07-31T10:30:00+03:00',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'release_notes': [
                  'Полный PASS защищённого обновления',
                  'Исправлен системный PackageInstaller stream',
                  'APK зашифрован только для зарегистрированного планшета',
                  'Проверка SHA-256, пакета, версии и подписи ARGUS'
              ]
          }
          Path('latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish encrypted payload only
        run: |
          set -euo pipefail
          rm -rf artifact artifact.zip
          git config user.name "ARGUS Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish final encrypted ARGUS 16.2.4 updater pass"
          git push
