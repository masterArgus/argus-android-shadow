name: Publish ARGUS 16.2.4 Device-Bound Encrypted Update

on:
  push:
    paths:
      - .github/workflows/publish-16204-device-bound.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==45.0.5

      - name: Download verified private artifact
        env:
          ARGUS_ARTIFACT_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b36c-820a-8d69-0044f9bac71c/raw?se=2026-07-31T06:17:11Z&sp=r&sv=2026-02-06&sr=b&scid=91d54f60-1b3b-511e-aa90-e2743d97e2e5&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T05:39:19Z&ske=2026-08-02T05:39:19Z&sks=b&skv=2026-02-06&sig=oTjbhyoIX3FCxJviQs7umCNoRE70VR8kiXO6tefD/0M%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARGUS_ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name 'ARGUS-MASTER-16.2.4-Device-Bound-Channel-Test.apk' | head -n1)"
          test -f "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "0a4228f05ad67abb9577d0aae0bff3a392fa21ce17b08a1a0bf3370833e8f965  $APK" | sha256sum -c -

      - name: Encrypt only for registered tablet
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, base64, hashlib, os
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          registration = json.loads(Path(f"devices/{device_id}.json").read_text(encoding="utf-8"))
          assert registration["device_id"] == device_id
          assert registration["algorithm"] == "RSA-3072-OAEP-SHA256"
          public_key = serialization.load_pem_public_key(registration["public_key_pem"].encode())
          der = public_key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == device_id

          apk = Path(os.environ["APK"])
          plaintext = apk.read_bytes()
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          assert plaintext_sha == "0a4228f05ad67abb9577d0aae0bff3a392fa21ce17b08a1a0bf3370833e8f965"

          aes_key = os.urandom(32)
          nonce = os.urandom(12)
          aad = b"ARGUS|stable-device-bound|com.argus.standalone.main|1620400|" + device_id.encode()
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None),
          )

          payload_name = f"ARGUS-MASTER-16.2.4-{device_id[:16]}.apk.enc"
          payload_dir = Path("payloads")
          payload_dir.mkdir(exist_ok=True)
          payload_path = payload_dir / payload_name
          payload_path.write_bytes(ciphertext)

          manifest = {
              "schema": 1,
              "channel": "stable-device-bound",
              "status": "ready",
              "package_name": "com.argus.standalone.main",
              "version_code": 1620400,
              "version_name": "16.2.4-master-device-bound-channel-test",
              "payload_url": f"https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}",
              "ciphertext_sha256": hashlib.sha256(ciphertext).hexdigest(),
              "plaintext_sha256": plaintext_sha,
              "wrapped_key_base64": base64.b64encode(wrapped_key).decode(),
              "nonce_base64": base64.b64encode(nonce).decode(),
              "aad_base64": base64.b64encode(aad).decode(),
              "certificate_sha256": "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0",
              "device_id": device_id,
              "published_at": "2026-07-31T09:12:00+03:00",
              "release_notes": [
                  "Контроль защищённого канала обновлений",
                  "APK зашифрован только для зарегистрированного планшета",
                  "Проверка SHA-256, пакета, версии и подписи ARGUS"
              ]
          }
          Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("publish-proof.txt").write_text(
              f"device_id={device_id}\nplaintext_sha256={plaintext_sha}\nciphertext_sha256={manifest['ciphertext_sha256']}\n",
              encoding="utf-8",
          )
          PY

      - name: Publish encrypted payload only
        run: |
          set -euo pipefail
          rm -rf artifact artifact.zip
          git config user.name "ARGUS Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads publish-proof.txt
          git commit -m "Publish encrypted ARGUS 16.2.4 for registered tablet"
          git push
