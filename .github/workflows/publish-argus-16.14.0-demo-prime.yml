name: Publish encrypted ARGUS 16.14.0 DEMO PRIME

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.14.0-demo-prime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify device-bound bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "a8aeb7988e5def60c1ff83db3b52b847bad470bb"
          test -z "$(git ls-files '*.apk')"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-ad44-8246-8a2f-8ebec5d76dae/raw?se=2026-08-03T08:00:24Z&sp=r&sv=2026-02-06&sr=b&scid=40412b75-ef59-5df7-ba7b-0acef3feb8d9&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T07:16:20Z&ske=2026-08-04T07:16:20Z&sks=b&skv=2026-02-06&sig=Ahy%2BNM0RxyTyz6OaBIQOSXPC%2BuCjd6jIBrZBYY%2BoMU4%3D' \
            --output /tmp/argus-161400-device-bound.zip
          echo 'e91602d8766b3e0ae7e36eff4f72591b522c5075034b460729b878b2e61dd177  /tmp/argus-161400-device-bound.zip' | sha256sum -c -
          rm -rf .argus-publish-161400
          mkdir .argus-publish-161400
          unzip -q /tmp/argus-161400-device-bound.zip -d .argus-publish-161400
          test -z "$(find .argus-publish-161400 -type f -name '*.apk' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          stage = Path('.argus-publish-161400')
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16013201:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2':
              raise SystemExit('Current channel belongs to another device')
          old_name = 'ARGUS-MASTER-16.13.2.1-bcc61ed52b22f6c8-v16013201.apk.enc'
          old_payload = Path('payloads') / old_name
          if not old_payload.is_file():
              raise SystemExit('Expected previous payload is missing')
          old_hash = hashlib.sha256(old_payload.read_bytes()).hexdigest()
          if old_hash != '2b90d077e9685cf25c42d17f245932a055ed9d6dae84931fbcfbd37d02986855':
              raise SystemExit('Previous payload hash mismatch')
          if current.get('ciphertext_sha256') != old_hash:
              raise SystemExit('Unexpected current channel hash')

          manifest = json.loads((stage / 'latest.json').read_text(encoding='utf-8'))
          proof = json.loads((stage / 'proof.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready-for-device-test',
              'package_name': 'com.argus.standalone.main',
              'version_code': 16014000,
              'version_name': '16.14.0-demo-prime-lab-foundation',
              'ciphertext_sha256': '6f40ddbfa94dfc84cdc3a4faf3b6176e307305b6ed44222248805cbe0de241d5',
              'plaintext_sha256': '699c843d9b1f9147297a17ac0aeb54ce726b208bd3278e5f5ecd5db40be1288d',
              'certificate_sha256': 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0',
              'device_id': 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2',
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'payload_size': 1443962,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}: {manifest.get(key)!r}')
          payload_name = 'ARGUS-MASTER-16.14.0-bcc61ed52b22f6c8-v16014000.apk.enc'
          expected_url = 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name
          if manifest.get('payload_url') != expected_url:
              raise SystemExit('Manifest payload URL mismatch')
          payload = stage / payload_name
          if not payload.is_file() or payload.stat().st_size != expected['payload_size']:
              raise SystemExit('Ciphertext size mismatch')
          if hashlib.sha256(payload.read_bytes()).hexdigest() != expected['ciphertext_sha256']:
              raise SystemExit('Ciphertext SHA-256 mismatch')
          for key in ('plaintext_sha256', 'ciphertext_sha256', 'payload_size',
                      'certificate_sha256', 'device_id', 'key_wrap_profile'):
              if proof.get(key) != expected[key]:
                  raise SystemExit(f'Proof mismatch for {key}')
          if proof.get('source_commit') != '9ed37ba9b376bb6f8b46e1d977a732c37fae6eef':
              raise SystemExit('Unexpected protected source commit')
          if proof.get('aes_gcm_round_trip') != 'PASS' or proof.get('rsa_key_bits') != 3072:
              raise SystemExit('Encryption proof failed')
          print('ARGUS 16.14.0 device-bound ciphertext: PASS')
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='ARGUS-MASTER-16.14.0-bcc61ed52b22f6c8-v16014000.apk.enc'
          OLD='ARGUS-MASTER-16.13.2.1-bcc61ed52b22f6c8-v16013201.apk.enc'
          mkdir -p payloads
          cp .argus-publish-161400/latest.json latest.json
          cp ".argus-publish-161400/$PAYLOAD" "payloads/$PAYLOAD"
          git rm -f "payloads/$OLD"
          git rm .github/workflows/publish-argus-16.14.0-demo-prime.yml
          git rm PUBLISH_16.14.0_TRIGGER.txt
          rm -rf .argus-publish-161400
          git add latest.json "payloads/$PAYLOAD"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.14.0 DEMO PRIME'
          git push origin HEAD:main
