name: Publish encrypted ARGUS 16.13.0.2 UPDATER COMMIT HOTFIX

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/publish-argus-16.13.0.2-updater-commit-hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact one-time publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          python3 -m pip install --disable-pip-version-check cryptography

      - name: Download and verify protected hotfix artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "f2307e9bad068538e748080997f2bfc965da57f4"
          test -z "$(git ls-files '*.apk')"
          URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-7ec0-81f4-8cc2-6a4e8622d7e2/raw?se=2026-08-02T13:17:04Z&sp=r&sv=2026-02-06&sr=b&scid=e155f7f6-d809-575b-8be0-3c7c8dbd7d7f&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T06:04:55Z&ske=2026-08-03T06:04:55Z&sks=b&skv=2026-02-06&sig=/YOMzIh0g8dsxkLAZrm5/dEA5jWnhdbH0UHUwbkMlcw%3D'
          curl --fail --location --retry 4 --retry-delay 1 "$URL" -o /tmp/argus-161302.zip
          echo '49913d2a4dc8d354c839c881cbf6a2e1c5eb587cb6d75dc9d8e9d76c0de48d8a  /tmp/argus-161302.zip' | sha256sum -c -
          rm -rf /tmp/argus-161302
          mkdir /tmp/argus-161302
          unzip -q /tmp/argus-161302.zip -d /tmp/argus-161302
          APK='/tmp/argus-161302/ARGUS-16.13.0.2-UPDATER-COMMIT-HOTFIX.apk'
          test -f "$APK"
          echo '296bf4dfb6a4a2c14a31fac730f5927e4dd4484e974257344238b06020dd63c9  /tmp/argus-161302/ARGUS-16.13.0.2-UPDATER-COMMIT-HOTFIX.apk' | sha256sum -c -
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.argus.standalone.main'" /tmp/badging.txt
          grep -q "versionCode='16013002'" /tmp/badging.txt
          grep -q "versionName='16.13.0.2-updater-commit-hotfix'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signature.txt
          CERT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' /tmp/signature.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$CERT" = 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/tmp/alignment.txt

      - name: Verify channel and encrypt for registered tablet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device = 'bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2'
          cert = 'd6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0'
          current = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          if current.get('version_code') != 16013100:
              raise SystemExit('Channel base version changed')
          if current.get('device_id') != device or current.get('certificate_sha256') != cert:
              raise SystemExit('Channel identity changed')
          if current.get('ciphertext_sha256') != 'ee3c8d21655504e5a7e216eca0befc89f41914e4ca095fd58535add9cb295d17':
              raise SystemExit('Current ciphertext changed')
          old = Path('payloads/ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc')
          if not old.is_file() or hashlib.sha256(old.read_bytes()).hexdigest() != current['ciphertext_sha256']:
              raise SystemExit('Current encrypted payload mismatch')

          public_pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA01MP53jzEzujpxxw5oXU
          ENsszGeq69DLwQLZQ6SWZ/ighUKcRvfSaPMj8ZT/o2CX5VeL6bc595xRFH85szC9
          XoOgD4C+R55iRKOvV9vAJAlsFWCsgWFYfiCEJE4lR8CmoUuUEcBYRwQ4pC4+j/nK
          OGLDRU8aG8NBoY+QCvprc7w+k09C+O9D48msfHWUEZCDPGlyeRDjYaVfKeNswLcm
          xj/Pqs808ChtDkp03fARCGE2UHw273a/3wjX8KjQeAIoMLSiqWY8z99Cx1SI4psi
          WescaJCFZp4Qf767v/79/FVItDXMyOD+ELHksWBA0734rhMVdycvRaGMsou8On4W
          2JtFP9Sd2bk8GY7a3JxfLx8P2BpZGXJs2rwc0HU+lXKidTcGeH7uJX2uAGunom5N
          M6DeMyLWnmRjKy9/hNDfEvtPBencvJ5d7NMgcMre3ZFCStx68JeqLrmE2wAWTu8n
          Z4xDa9dL/foQ3WfGeKbn21G9nllmW3kzPzlyHoGUF2bbAgMBAAE=
          -----END PUBLIC KEY-----
          '''.replace(b'          ', b'')
          public_key = serialization.load_pem_public_key(public_pem)
          if public_key.key_size != 3072:
              raise SystemExit('Unexpected tablet RSA key size')

          apk = Path('/tmp/argus-161302/ARGUS-16.13.0.2-UPDATER-COMMIT-HOTFIX.apk').read_bytes()
          plain_sha = hashlib.sha256(apk).hexdigest()
          if plain_sha != '296bf4dfb6a4a2c14a31fac730f5927e4dd4484e974257344238b06020dd63c9':
              raise SystemExit('Hotfix APK hash changed')
          package = 'com.argus.standalone.main'
          version_code = 16013002
          version_name = '16.13.0.2-updater-commit-hotfix'
          payload_name = 'ARGUS-MASTER-16.13.0.2-bcc61ed52b22f6c8-v16013002.apk.enc'
          aad = f'ARGUS|stable-device-bound|{package}|{version_code}|{device}'.encode()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, apk, aad)
          if AESGCM(aes_key).decrypt(nonce, ciphertext, aad) != apk:
              raise SystemExit('AES-GCM round-trip failed')
          wrapped = public_key.encrypt(aes_key, padding.OAEP(
              mgf=padding.MGF1(algorithm=hashes.SHA1()),
              algorithm=hashes.SHA256(), label=None))
          if len(wrapped) != 384:
              raise SystemExit('Unexpected wrapped key size')

          payload = Path('payloads') / payload_name
          payload.write_bytes(ciphertext)
          manifest = {
              'schema': 1,
              'channel': 'stable-device-bound',
              'status': 'ready',
              'package_name': package,
              'version_code': version_code,
              'version_name': version_name,
              'payload_url': 'https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/' + payload_name,
              'payload_size': len(ciphertext),
              'ciphertext_sha256': hashlib.sha256(ciphertext).hexdigest(),
              'plaintext_sha256': plain_sha,
              'wrapped_key_base64': base64.b64encode(wrapped).decode('ascii'),
              'nonce_base64': base64.b64encode(nonce).decode('ascii'),
              'aad_base64': base64.b64encode(aad).decode('ascii'),
              'certificate_sha256': cert,
              'device_id': device,
              'published_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'key_wrap_profile': 'RSA-OAEP-SHA256-MGF1-SHA1',
              'release_notes': [
                  'Исправлена установка через Android PackageInstaller: поток APK закрывается до session.commit',
                  'Ошибка BLOCKED: Files still open устранена в контракте обновлятора',
                  'fsync и обязательное системное подтверждение установки сохранены',
                  'При ошибке незавершённая PackageInstaller-сессия безопасно отменяется',
                  'Экран обновлений показывает фактически установленную версию ARGUS вместо устаревшей 16.2.3',
                  'Навигация Разработка и встроенная диагностика 16.13.0.1 сохранены',
                  'Торговое ядро и PRIME Weekly Test Engine этим hotfix не изменяются',
                  'Реальные и автоматические ордера остаются HARD BLOCKED; execution capability равна 0'
              ]
          }
          Path('latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          proof = {
              'source_commit': '7bacfb46c001181e1f0affaa055bc8476ff46644',
              'build_run_id': 30749245985,
              'artifact_id': 8833906837,
              'artifact_zip_sha256': '49913d2a4dc8d354c839c881cbf6a2e1c5eb587cb6d75dc9d8e9d76c0de48d8a',
              'plaintext_sha256': plain_sha,
              'ciphertext_sha256': manifest['ciphertext_sha256'],
              'payload_size': len(ciphertext),
              'certificate_sha256': cert,
              'device_id': device,
              'aes_gcm_round_trip': 'PASS',
              'rsa_key_bits': public_key.key_size,
              'key_wrap_profile': manifest['key_wrap_profile']
          }
          Path('/tmp/proof-161302.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY

      - name: Atomically publish hotfix and remove one-time material
        shell: bash
        run: |
          set -euo pipefail
          NEW='payloads/ARGUS-MASTER-16.13.0.2-bcc61ed52b22f6c8-v16013002.apk.enc'
          OLD='payloads/ARGUS-MASTER-16.13.1-bcc61ed52b22f6c8-v16013100.apk.enc'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          proof = json.loads(Path('/tmp/proof-161302.json').read_text())
          payload = Path('payloads/ARGUS-MASTER-16.13.0.2-bcc61ed52b22f6c8-v16013002.apk.enc')
          assert manifest['version_code'] == 16013002
          assert manifest['payload_size'] == payload.stat().st_size
          assert manifest['ciphertext_sha256'] == hashlib.sha256(payload.read_bytes()).hexdigest()
          assert manifest['plaintext_sha256'] == '296bf4dfb6a4a2c14a31fac730f5927e4dd4484e974257344238b06020dd63c9'
          assert proof['aes_gcm_round_trip'] == 'PASS'
          assert proof['rsa_key_bits'] == 3072
          print('ARGUS 16.13.0.2 device-bound publication: PASS')
          PY
          git rm -f "$OLD"
          git rm .github/workflows/publish-argus-16.13.0.2.yml
          git add latest.json "$NEW"
          test -z "$(git ls-files '*.apk')"
          test "$(git ls-files 'payloads/*.enc' | wc -l)" -eq 1
          git config user.name 'ARGUS Secure Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish encrypted ARGUS 16.13.0.2 UPDATER COMMIT HOTFIX'
          git push origin HEAD:main
