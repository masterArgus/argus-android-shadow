name: Publish ARGUS 16.4.0 Device-Bound Update

on:
  push:
    paths:
      - .github/workflows/publish-1640.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download verified private APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9acc-81fd-9b1e-36023c2246e0/raw?se=2026-07-31T12:22:23Z&sp=r&sv=2026-02-06&sr=b&scid=d4f59270-79c6-56c7-887a-793ecea92d19&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T02:04:27Z&ske=2026-08-02T02:04:27Z&sks=b&skv=2026-02-06&sig=MHEMP5RB%2Bv5PgguhskqbSnyeF2Vs0AtUj/2YtRQSIog%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name 'ARGUS-MASTER-16.4.0-Market-Data-Plane.apk' | head -n1)"
          test -f "$APK"
          echo "90f79f5939a97ef134e88437c8992d1416696138472d9563efca26e670bfe290  $APK" | sha256sum -c -
          cp "$APK" ARGUS-16.4.0.apk

      - name: Encrypt update for registered tablet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==45.0.5
          python - <<'PY'
          import base64, hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          public_key_pem = b"""-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA01MP53jzEzujpxxw5oXU
          ENsszGeq69DLwQLZQ6SWZ/ighUKcRvfSaPMj8ZT/o2CX5VeL6bc595xRFH85szC9
          XoOgD4C+R55iRKOvV9vAJAlsFWCsgWFYfiCEJE4lR8CmoUuUEcBYRwQ4pC4+j/nK
          OGLDRU8aG8NBoY+QCvprc7w+k09C+O9D48msfHWUEZCDPGlyeRDjYaVfKeNswLcm
          xj/Pqs808ChtDkp03fARCGE2UHw273a/3wjX8KjQeAIoMLSiqWY8z99Cx1SI4psi
          WescaJCFZp4Qf767v/79/FVItDXMyOD+ELHksWBA0734rhMVdycvRaGMsou8On4W
          2JtFP9Sd2bk8GY7a3JxfLx8P2BpZGXJs2rwc0HU+lXKidTcGeH7uJX2uAGunom5N
          M6DeMyLWnmRjKy9/hNDfEvtPBencvJ5d7NMgcMre3ZFCStx68JeqLrmE2wAWTu8n
          Z4xDa9dL/foQ3WfGeKbn21G9nllmW3kzPzlyHoGUF2bbAgMBAAE=
          -----END PUBLIC KEY-----
          """
          public_key_pem = b"\n".join(line.strip() for line in public_key_pem.splitlines() if line.strip()) + b"\n"
          apk = Path("ARGUS-16.4.0.apk").read_bytes()
          plaintext_sha = hashlib.sha256(apk).hexdigest()
          if plaintext_sha != "90f79f5939a97ef134e88437c8992d1416696138472d9563efca26e670bfe290":
              raise SystemExit("plaintext SHA mismatch")

          version_code = 1640000
          aad = f"ARGUS|stable-device-bound|com.argus.standalone.main|{version_code}|{device_id}".encode()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, apk, aad)
          public_key = serialization.load_pem_public_key(public_key_pem)
          wrapped = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA1()),
                  algorithm=hashes.SHA256(),
                  label=None))

          payload_name = "ARGUS-MASTER-16.4.0-bcc61ed52b22f6c8.apk.enc"
          payload_path = Path("payloads") / payload_name
          payload_path.parent.mkdir(parents=True, exist_ok=True)
          payload_path.write_bytes(ciphertext)

          manifest = {
              "schema": 1,
              "channel": "stable-device-bound",
              "status": "ready",
              "package_name": "com.argus.standalone.main",
              "version_code": version_code,
              "version_name": "16.4.0-master-market-data-plane",
              "payload_url": f"https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}",
              "ciphertext_sha256": hashlib.sha256(ciphertext).hexdigest(),
              "plaintext_sha256": plaintext_sha,
              "wrapped_key_base64": base64.b64encode(wrapped).decode(),
              "nonce_base64": base64.b64encode(nonce).decode(),
              "aad_base64": base64.b64encode(aad).decode(),
              "certificate_sha256": "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0",
              "device_id": device_id,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "key_wrap_profile": "RSA-OAEP-SHA256-MGF1-SHA1",
              "release_notes": [
                  "Добавлен Android Market Data Plane для 7 пар",
                  "Добавлены bookTicker и последняя закрытая свеча 1m",
                  "Добавлены контроль времени Binance и spread",
                  "Добавлен транзакционный SQLite-кэш рынка",
                  "Торговые операции остаются HARD BLOCKED"
              ]
          }
          Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("ARGUS 16.4.0 encrypted publication PASS")
          PY

      - name: Publish and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ARGUS-16.4.0.apk artifact.zip
          rm -rf artifact
          git rm .github/workflows/publish-1640.yml
          git config user.name "ARGUS Release Bot"
          git config user.email "argus-release@users.noreply.github.com"
          git add latest.json payloads/
          git commit -m "Publish encrypted ARGUS 16.4.0 market data plane"
          git push
