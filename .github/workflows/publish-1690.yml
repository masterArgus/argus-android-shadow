name: Publish encrypted ARGUS 16.9.0 GAME MASTER

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-1690.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout channel
        uses: actions/checkout@v4

      - name: Reassemble and verify encrypted device-bound payload
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.9.0-bcc61ed52b22f6c8.apk.enc"
          mkdir -p payloads
          cat staging/payload-*.b64 | base64 -d > "payloads/$NEW"
          echo "48e6a1693b7cb00c01919b22078e975749eb24fd99efc61f8380a2a5ce4b5639  payloads/$NEW" | sha256sum -c -
          cp staging/latest-1690.json latest.json
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          payload = Path("payloads/ARGUS-MASTER-16.9.0-bcc61ed52b22f6c8.apk.enc")
          assert manifest["schema"] == 1
          assert manifest["channel"] == "stable-device-bound"
          assert manifest["status"] == "ready"
          assert manifest["package_name"] == "com.argus.standalone.main"
          assert manifest["version_code"] == 1690000
          assert manifest["version_name"] == "16.9.0-master-game-master-demo"
          assert manifest["device_id"] == "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          assert manifest["certificate_sha256"] == "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0"
          assert manifest["plaintext_sha256"] == "cbf52cc58554041428d3faf92ff548e170fd9aae85c04f729746849f348a8633"
          assert hashlib.sha256(payload.read_bytes()).hexdigest() == manifest["ciphertext_sha256"]
          assert len(base64.b64decode(manifest["wrapped_key_base64"])) == 384
          assert len(base64.b64decode(manifest["nonce_base64"])) == 12
          assert manifest["key_wrap_profile"] == "RSA-OAEP-SHA256-MGF1-SHA1"
          assert not list(Path(".").rglob("*.apk"))
          print("ARGUS_16_9_DEVICE_BOUND_PUBLICATION PASS")
          PY

      - name: Publish encrypted payload and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          NEW="ARGUS-MASTER-16.9.0-bcc61ed52b22f6c8.apk.enc"
          find payloads -maxdepth 1 -type f -name '*.enc' ! -name "$NEW" -delete
          git rm .github/workflows/publish-1690.yml
          git rm -r staging
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish encrypted ARGUS 16.9.0 GAME MASTER DEMO"
          git push origin HEAD:main
