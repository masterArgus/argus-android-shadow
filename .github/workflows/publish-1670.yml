name: Publish encrypted ARGUS 16.7.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout channel main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified private artifact
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-58f0-81f4-a95a-7259bdd36f4f/raw?se=2026-07-31T17:19:29Z&sp=r&sv=2026-02-06&sr=b&scid=50479fe4-cbc2-587f-b521-76bdf7624ed2&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T02:13:39Z&ske=2026-08-02T02:13:39Z&sks=b&skv=2026-02-06&sig=TydQI8FX/HC/GMw09ZRZggqDBnEk1v5k9mSD0WznhnM%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/ARGUS-MASTER-16.7.0-Second-Floor-Strategy-Lab.apk
          echo "aab6a46de63ea98573d937d48a22fbe10d33e812bb95bc186ccf58de4daa8a0e  artifact/ARGUS-MASTER-16.7.0-Second-Floor-Strategy-Lab.apk" | sha256sum -c -

      - name: Encrypt for registered tablet and write manifest
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          device_id = "bcc61ed52b22f6c8620c8546ddb2c4154b5ed3213d852d23b15f3bcb980571d2"
          version_code = 1670000
          version_name = "16.7.0-master-second-floor-strategy-lab"
          package_name = "com.argus.standalone.main"
          certificate_sha256 = "d6af01d471b1a3c7ee14c69b5ba80d57a5011974e6c811faae1c1e58573a95e0"
          public_key_der_b64 = ""

          apk_path = Path("artifact/ARGUS-MASTER-16.7.0-Second-Floor-Strategy-Lab.apk")
          plaintext = apk_path.read_bytes()
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          expected_sha = "aab6a46de63ea98573d937d48a22fbe10d33e812bb95bc186ccf58de4daa8a0e"
          if plaintext_sha != expected_sha:
              raise SystemExit("plaintext hash mismatch")

          aad = f"ARGUS|stable-device-bound|{package_name}|{version_code}|{device_id}".encode()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          public_key = serialization.load_der_public_key(base64.b64decode(public_key_der_b64))
          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA1()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )

          payload_dir = Path("payloads")
          payload_dir.mkdir(exist_ok=True)
          for old in payload_dir.glob("*.enc"):
              old.unlink()
          payload_name = "ARGUS-MASTER-16.7.0-bcc61ed52b22f6c8.apk.enc"
          payload_path = payload_dir / payload_name
          payload_path.write_bytes(ciphertext)

          manifest = {
              "schema": 1,
              "channel": "stable-device-bound",
              "status": "ready",
              "package_name": package_name,
              "version_code": version_code,
              "version_name": version_name,
              "payload_url": f"https://raw.githubusercontent.com/masterArgus/argus-android-shadow/main/payloads/{payload_name}",
              "ciphertext_sha256": hashlib.sha256(ciphertext).hexdigest(),
              "plaintext_sha256": plaintext_sha,
              "wrapped_key_base64": base64.b64encode(wrapped_key).decode(),
              "nonce_base64": base64.b64encode(nonce).decode(),
              "aad_base64": base64.b64encode(aad).decode(),
              "certificate_sha256": certificate_sha256,
              "device_id": device_id,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "key_wrap_profile": "RSA-OAEP-SHA256-MGF1-SHA1",
              "release_notes": [
                  "Добавлен локальный 2-й этаж Strategy Lab",
                  "Запущены четыре независимых исследовательских агента",
                  "Replay выполняется по закрытым 5m-свечам с горизонтом 15 минут",
                  "Результаты учитывают консервативную модель затрат 12 bps",
                  "Добавлена отдельная SQLite-база гипотез и калибровки",
                  "Секретарь №2 получает локальный статус и replay-метрики",
                  "Исследовательские гипотезы имеют боевой вес 0",
                  "Telegram-сигналы, Entry, SL, TP и торговое разрешение запрещены",
                  "Автоматические ордера остаются HARD BLOCKED"
              ],
          }
          Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish encrypted payload only
        run: |
          set -euo pipefail
          rm -rf artifact artifact.zip
          git rm .github/workflows/publish-1670.yml
          git config user.name "ARGUS Secure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json payloads
          git commit -m "Publish encrypted ARGUS 16.7.0 second-floor strategy lab"
          git push origin HEAD:main
